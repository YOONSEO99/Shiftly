<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiftly - Edit Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="edit-profile.css">
</head>
<body>
    <header class="top-bar">
        <div class="logo">Shiftly</div>
        <div class="user-menu">
            <a href="index.html" class="nav-link">Cancel & Back</a>
        </div>
    </header>

    <main class="main-container auth-container" style="margin-top: 40px; margin-bottom: 80px;">
        <h2>Edit Profile</h2>
        <form id="editProfileForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label for="username">Username (Min 6 characters)</label>
                <input type="text" id="username" required>
            </div>
            
            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" required>
            </div>

            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" required>
            </div>
            
            <div class="form-group">
                <label for="birthDate">Birth Date</label>
                <input type="date" id="birthDate" required>
            </div>

            <div class="form-group">
                <label for="password">Password (Min 6 characters)</label>
                <input type="password" id="password" required>
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Password Confirmation</label>
                <input type="password" id="confirmPassword" required>
            </div>

            <div id="errorMessage" class="error-message"></div>
            <button type="submit" id="updateBtn">Update</button>
        </form>
    </main>
    
    <script src="edit-profile.js"></script>
</body>
</html>
