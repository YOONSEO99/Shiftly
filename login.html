<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiftly - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <h1>Shiftly</h1>
        <h2>Welcome Back</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usename</label>
                <input type="text" id="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="e.g., dfg327!" required>
            </div>

            <div id="errorMessage" class="error-message"></div>
            <button type="submit" id="loginBtn">Login</button>
        </form>
        <button type="button" id="confirmRegistrationBtn" class="secondary-btn" onclick="window.location.href='register.html'">Confirm Registration</button>
    </div>
    <script src="login.js"></script>
</body>
</html>
